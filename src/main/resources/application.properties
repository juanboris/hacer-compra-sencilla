#Secretos: se leen de variables de entorno. En local se cargan desde .env (no versionado, ver .env.example)
spring.config.import=optional:file:.env[.properties]
#Base de datos (por defecto, la local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/listaCompra?useSSL=false}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
server.port=${PORT:8080}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
#Cambiar a update para produccion
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=update
#Con el none como valor, la base de datos no actualiza las modificaciones. Poner a update si quiero hacer alguna modificaci?n
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none
logging.level.org.hibernate.SQL=debug
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
#spring.main.lazy-initialization=true
server.tomcat.max-threads=5
server.tomcat.min-spare-threads=1
#AWS configuracion
endpointUrl = ${AWS_S3_ENDPOINT_URL:https://s3.cloudLocation.amazonaws.com}
accessKey = ${AWS_ACCESS_KEY_ID}
secretKey = ${AWS_SECRET_ACCESS_KEY}
bucketName = ${AWS_S3_BUCKET:hacercomprasencilla}
#JWT (PEM; los saltos de linea pueden escribirse como \n literal)
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
